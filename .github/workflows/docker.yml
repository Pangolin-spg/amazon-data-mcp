name: Build and publish Docker image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image version, without the v prefix
        required: true
        default: 0.1.2
  release:
    types: [published]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - tsconfig.json
      - src/**
      - .github/workflows/docker.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - tsconfig.json
      - src/**
      - .github/workflows/docker.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: pangolinfo
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Resolve image version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=test" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
          tags: |
            ghcr.io/pangolin-spg/amazon-data-mcp:${{ steps.version.outputs.value }}
            ghcr.io/pangolin-spg/amazon-data-mcp:latest
            docker.io/pangolinfo/amazon-data-mcp:${{ steps.version.outputs.value }}
            docker.io/pangolinfo/amazon-data-mcp:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
